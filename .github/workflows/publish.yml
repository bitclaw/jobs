name: Publish

# Tag push (npm version <bump> && git push --follow-tags) publishes to npmjs
# through npm trusted publishing: OIDC, no NPM_TOKEN secret, provenance
# attached. Configure the trusted publisher for this repo + publish.yml on
# npmjs.com before the first tag, or the publish step fails with 404.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@11.21.0
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run knip
      - run: bun run test
      - run: bun run build
      - run: npm publish --provenance --access public
