name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repo; a hijacked action gets no write token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run knip
      - run: bun run typecheck
      - run: bun run test
